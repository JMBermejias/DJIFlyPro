apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def configuredSecret = { name ->
    def value = project.findProperty(name)
    value == null || value.toString().isBlank() ? System.getenv(name) : value
}
def configuredRuntimeValue = { name ->
    def value = System.getenv(name)
    value == null || value.toString().isBlank() ? project.findProperty(name) : value
}
def releaseStoreFile = configuredSecret('STORE_FILE')
def releaseStorePassword = configuredSecret('STORE_PASSWORD')
def releaseKeyAlias = configuredSecret('KEY_ALIAS')
def releaseKeyPassword = configuredSecret('KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.toString().isBlank() }
def aircraftApiKey = configuredRuntimeValue('AIRCRAFT_API_KEY')
def hasAircraftApiKey = aircraftApiKey != null && !aircraftApiKey.toString().isBlank()
// Not a DJI key. DJI only provides the manifest slot; the value is a Mapbox
// token or a MapTiler key. Missing is not fatal, the app still registers and
// flies, but every map view renders blank, so it is worth saying out loud.
def mapLibreToken = configuredRuntimeValue('MAPLIBRE_TOKEN')
def hasMapLibreToken = mapLibreToken != null && !mapLibreToken.toString().isBlank()

/**
 * A release artifact without a DJI App Key can never register with the SDK, so
 * it is not a distributable build even though it compiles and signs. Failing
 * here prevents shipping an APK that looks releasable but cannot connect to
 * any aircraft.
 */
def allowMissingApiKey = System.getenv("DJIFLYPRO_ALLOW_MISSING_API_KEY") == "1"
def assertReleasePreflight = {
    if (hasAircraftApiKey) {
        // A DJI App Key is a bare hex token. Quotes, spaces and any other
        // character mean the value was mangled on its way in, and the SDK will
        // reject it with INVALID_METADATA, which reads exactly like "wrong key"
        // and sends people to the DJI console instead of to the build script.
        // That is not hypothetical: a quoted .properties value survived the bash
        // reader and shipped a 26-character key with two quote characters in it,
        // and the key DJI had issued was correct all along.
        def raw = aircraftApiKey.toString()
        if (raw != raw.trim() || raw.contains('"') || raw.contains("'") || raw.contains(' ')) {
            throw new GradleException(
                    "\nDJIFlyPro: la comprobación previa ha fallado: AIRCRAFT_API_KEY está mal formada.\n" +
                    "Contiene comillas o espacios, así que no es una App Key de DJI desnuda.\n" +
                    "Longitud: " + raw.length() + " caracteres, empieza por " + raw.take(6) + "\n" +
                    "Es un token hexadecimal de 24 caracteres. Si .local/api-key.properties entrecomilla el\n" +
                    "valor, las comillas forman parte de él salvo que un lector las quite.\n")
        }
        if (raw.length() != 24) {
            logger.warn(
                    "\n*** DJIFlyPro: AIRCRAFT_API_KEY has " + raw.length() + " characters, not the\n" +
                    "*** 24 that DJI issues. Compila y firma, pero si el SDK la rechaza,\n" +
                    "*** el build es lo primero que conviene mirar.\n")
        }
    }
    if (!hasAircraftApiKey) {
        if (allowMissingApiKey) {
            logger.warn(
                    "\n*** DJIFlyPro: compilando una release SIN App Key de DJI porque\n" +
                    "*** DJIFLYPRO_ALLOW_MISSING_API_KEY=1 está definido. La APK y el AAB resultantes\n" +
                    "*** NO pueden registrarse con DJI y NO son distribuibles. Solo para verificación local.\n")
        } else {
            throw new GradleException(
                    "\nDJIFlyPro: la comprobación previa de la release ha fallado: AIRCRAFT_API_KEY está vacía.\n" +
                    "Registra el applicationId 'com.djiflypro.app' en la consola de DJI Developer y\n" +
                    "define AIRCRAFT_API_KEY en gradle.properties o como variable de entorno.\n" +
                    "Ver docs/BUILD.md. Una APK firmada sin esta clave no puede registrarse con DJI.\n" +
                    "Solo para comprobar la cadena de build, define DJIFLYPRO_ALLOW_MISSING_API_KEY=1.\n")
        }
    }
    if (!hasMapLibreToken) {
        logger.warn(
                "\n*** DJIFlyPro: compilando SIN token de mapa. MAPLIBRE_TOKEN está vacío.\n" +
                "*** La app se registrará y conectará, pero todos los mapas saldrán en blanco.\n" +
                "*** Es un token de Mapbox o una clave de MapTiler, no una clave de DJI: DJI solo\n" +
                "*** proporciona el hueco del manifiesto com.dji.mapkit.maplibre.apikey.\n" +
                "*** Define MAPLIBRE_TOKEN en .local/api-key.properties. Ver docs/MAPA.md.\n")
    }
    if (!hasReleaseSigning) {
        throw new GradleException(
                "\nDJIFlyPro: la comprobación previa ha fallado: la configuración de firma está incompleta.\n" +
                "Define STORE_FILE, STORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD fuera del repositorio.\n" +
                "Ver config/README.md. No uses la keystore de pruebas local para distribuir.\n")
    }
}

android {
    namespace "dji.sampleV5.aircraft"
    compileSdkVersion Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)

    defaultConfig {
        applicationId "com.djiflypro.app"
        minSdkVersion Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        versionCode 11
        versionName "1.1.0-alpha.10"
        manifestPlaceholders["API_KEY"] = aircraftApiKey ?: ''
        manifestPlaceholders["GMAP_API_KEY"] = configuredRuntimeValue('GMAP_API_KEY') ?: ''
        manifestPlaceholders["MAPLIBRE_TOKEN"] = configuredRuntimeValue('MAPLIBRE_TOKEN') ?: ''
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        release {
            assets.exclude 'apk/app-debug.apk'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // AGP omits the JAR signature (v1) when minSdk is 24 or
                // above, because the platform verifies v2 on its own, and it
                // ignores enableV1Signing at that minSdk. That is the right
                // trade for this app: v1 would only help third-party installers
                // with pre-7.0 code paths, at the cost of a second full
                // signature pass over a 200 MB package. v2 and v3 are stated
                // explicitly rather than left to the default, so the published
                // artifact's signature schemes are a decision and not a
                // side effect of the minSdk.
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        // 因为mrtc库内部使用了NDK的c++_shared的编译参数
        // 与其他库重复引用了，因此选其中一个即可
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    packagingOptions {
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    buildFeatures {
        viewBinding true
    }
}

/**
 * Guard the release packaging tasks. Checked against the task graph so it
 * catches every entry point (assembleRelease, bundleRelease, or a task that
 * depends on them) without affecting debug builds.
 */
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /^(package|bundle|sign|assemble)Release$/
    }
    if (releaseRequested) {
        assertReleasePreflight()
    }
}

/**
 * The shipped WPML allowlist is validated by ShippedWpmlAllowlistTest. Declaring
 * it as an input makes the unit-test task re-run when the allowlist changes, so
 * an invalid or placeholder-filled entry fails the build instead of reaching a
 * device.
 */
tasks.withType(Test).configureEach {
    inputs.file(file("src/main/assets/validated_wpml_profiles.json"))
        .withPropertyName("validatedWpmlProfiles")
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

/**
 * Prints the app version so release scripts can name artifacts from a single
 * source of truth instead of repeating the version by hand, which is how a
 * published filename ends up disagreeing with the binary it contains.
 */
tasks.register('printAppVersion') {
    def versionName = android.defaultConfig.versionName
    def versionCode = android.defaultConfig.versionCode
    doLast {
        println "versionName=$versionName"
        println "versionCode=$versionCode"
    }
}

dependencies {
    /** <-----------------依赖MSDK--------------------> **/
    compileOnly deps.aircraftProvided
    implementation deps.aircraft
    runtimeOnly deps.networkImp

    /** <-----------------sample所需--------------------> **/
    implementation project(':uxsdk')
    implementation deps.appcompat
    implementation deps.gson
    implementation deps.constraintLayout
    implementation deps.aacCommon
    implementation deps.aacRuntime
    implementation deps.kotlinLib
    implementation deps.ktxCore
    implementation deps.ktxFrag
    implementation deps.ktxNavigation
    implementation deps.ktxNavigationUi
    implementation deps.recyclerview
    implementation deps.legacySupport
    implementation deps.lifecycleViewModel
    implementation deps.lifecycleLiveData
    debugImplementation deps.leakcanary
    implementation deps.glide
    implementation deps.dynamicanimation
    implementation deps.expandedit
    implementation deps.rx3Kt
    implementation deps.dom
    kapt deps.glidecompiler
    implementation deps.lynx
    testImplementation deps.junit4
}